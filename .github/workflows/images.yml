name: Images

# Builds the three images for linux/amd64 and linux/arm64 on native runners
# (no QEMU emulation, so the jobs stay fast), then publishes multi-arch tags to
# ghcr.io/<owner>/netdispatch-{server,relay,samba}:
#   pull request (this repo) -> pr-<number>, sha-<short>   (deploy and test before merging)
#   pull request (fork)      -> build only: forks get no token that can push packages
#   main                     -> latest, main, sha-<short>
#   v* tag                   -> X.Y.Z, X.Y, sha-<short>

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [server, relay, samba]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: server
            target: runtime
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netdispatch-${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    # One job with a fixed name (a skipped matrix job would show its
    # unexpanded name). Skipped only for pull requests from forks.
    name: Publish to GHCR
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are computed once against a placeholder name, then applied to each image.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: placeholder
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create multi-arch manifests
        run: |
          set -eu
          tags=$(jq -r '.tags[] | sub("^placeholder:"; "")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          {
            echo "### Published images"
            echo
            echo "Tags: $(paste -sd' ' <<< "$tags")"
            echo
            echo '```bash'
          } >> "$GITHUB_STEP_SUMMARY"
          for image in server relay samba; do
            name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netdispatch-${image}"
            args=""
            for t in $tags; do args="$args -t ${name}:${t}"; done
            for d in /tmp/digests/digests-"${image}"-*/*; do args="$args ${name}@sha256:$(basename "$d")"; done
            echo "::group::${name}"
            # shellcheck disable=SC2086
            docker buildx imagetools create $args
            docker buildx imagetools inspect "${name}:${{ steps.meta.outputs.version }}"
            echo "::endgroup::"
            echo "docker pull ${name}:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
