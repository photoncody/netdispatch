{% from "unattend/_macros.html" import section %}
{% call section('bloatware', 'Remove apps', "gen.f.bloatware.length ? gen.f.bloatware.length + ' selected' : 'none'") %}
  <div class="flex gap-2 text-xs">
    <button type="button" @click="gen.f.bloatware = gen.schema.bloatware.map(b => b.id); genChanged()" class="rounded-md border border-slate-700 px-2 py-1 text-slate-400 hover:border-slate-500 hover:text-slate-200">Select all</button>
    <button type="button" @click="gen.f.bloatware = []; genChanged()" class="rounded-md border border-slate-700 px-2 py-1 text-slate-400 hover:border-slate-500 hover:text-slate-200">Select none</button>
  </div>
  <div class="grid gap-x-4 gap-y-1.5 sm:grid-cols-2 lg:grid-cols-3">
    <template x-for="b in gen.schema.bloatware" :key="b.id">
      <label class="flex items-center gap-2 text-sm text-slate-200">
        <input type="checkbox" :value="b.id" x-model="gen.f.bloatware" class="h-4 w-4 shrink-0 accent-emerald-500">
        <span x-text="b.displayName"></span>
      </label>
    </template>
  </div>
{% endcall %}
