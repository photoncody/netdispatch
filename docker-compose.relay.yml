# netdispatch PXE relay (spoke) - deploy one per subnet / VLAN.
#
# Requirements:
#   * a Linux host with an interface on the target subnet (Docker Desktop on
#     Windows/macOS cannot receive DHCP broadcasts through host networking)
#   * nothing else on that host answering DHCP (port 67) or TFTP (port 69)
#   * the hub reachable from the host AND from PXE clients at CENTRAL_SERVER_URL
#
# Easiest: create the relay in the hub UI (Relays -> Add relay). It gives you
# a ready-made compose file with RELAY_ID and a per-relay RELAY_API_KEY
# already filled in.
#
# This file is the same thing written by hand. It runs the prebuilt image
# (amd64 + arm64), so it works on its own: copy it to the relay host as
# docker-compose.yml, edit the values below, then:
#
#   docker compose up -d
name: netdispatch-relay

services:
  relay:
    image: ghcr.io/photoncody/netdispatch-relay:latest
    # To build from a local checkout of this repo instead, swap the image line
    # above for these two, then run: docker compose up -d --build
    # build: ./relay
    # image: netdispatch-relay:local
    container_name: netdispatch-relay
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN]
    environment:
      # Hub URL used by iPXE clients AND the heartbeat (normally the hub's
      # BOOT_BASE_URL).
      CENTRAL_SERVER_URL: http://10.0.0.5:8000
      # Unique ID: lowercase letters, digits, . _ -
      RELAY_ID: site-office-vlan20
      RELAY_NAME: Office VLAN 20
      # Per-relay key from the hub UI (or the hub's bootstrap RELAY_API_KEY).
      RELAY_API_KEY: "paste-the-relay-key-here"

      # --- Options (defaults shown) ------------------------------------------
      # Interface on the PXE subnet. Default: interface of the default route.
      # RELAY_INTERFACE: eth0
      # dnsmasq ProxyDHCP range. Default: derived from RELAY_INTERFACE.
      # SUBNET_RANGE: 192.168.20.0,proxy
      # UEFI boot file: ipxe.efi (iPXE NIC drivers) or snponly.efi (firmware
      # NIC driver, more compatible with some NICs).
      # UEFI_BOOTFILE: ipxe.efi
      # Clients whose firmware/NIC ROM already runs iPXE (e.g. Proxmox/QEMU VMs):
      #   chainload - give them netdispatch's iPXE build too (HTTPS + your CA)
      #   direct    - let them fetch the boot script directly (one TFTP transfer less)
      # IPXE_CLIENTS: chainload
      # UEFI Secure Boot: "true" serves the iPXE project's Microsoft-signed shim
      # and signed iPXE to UEFI machines, so they boot with Secure Boot on.
      # Payloads must be signed too (Windows, or ISOs with a signed loader via
      # sanboot); the hub URL can't rely on a private CA from relay/certs.
      # SECURE_BOOT: "false"
      # Log every DHCP exchange (useful while setting up).
      # RELAY_LOG_DHCP: "true"
      # HEARTBEAT_INTERVAL: "30"

      # --- Image cache (for sites with a slow link to the hub) ---------------
      # "true": keep local copies of the images assigned to this relay in the
      # hub (Relays -> Cache) and serve them on this LAN: HTTP on
      # CACHE_HTTP_PORT, SMB on 445 for Windows Setup. Machines boot from the
      # hub until an image is complete here. Also uncomment the volume below.
      # RELAY_CACHE: "false"
      # CACHE_HTTP_PORT: "8080"
      # Address machines reach the cache at. Default: http://<relay IP>:<port>
      # CACHE_URL: http://relay.site.example:8080
      # CACHE_SMB: "true"             # "false": Windows Setup uses the hub's share
      # CACHE_RATE_LIMIT: "20M"       # cap downloads from the hub (bytes/s)
      # CACHE_SYNC_WINDOW: "22:00-06:00"  # only start downloads in this window
      # TZ: Europe/Berlin             # time zone for CACHE_SYNC_WINDOW
    # volumes:
    #   - ./cache:/cache
